<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Abrindo o WhatsApp · Noiva Joias MT</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf6ee;color:#1d1b16;font:17px/1.5 system-ui,Arial,sans-serif;text-align:center;padding:24px}a{display:inline-block;margin-top:14px;background:#1f7a4d;color:#fff;padding:14px 22px;border-radius:999px;text-decoration:none;font-weight:700}</style>
</head>
<body>
<!-- LINK CURTO DO WHATSAPP COM CANAL — /zap?nj=<canal> (17/11/2026).
     Conta 1 visita + 1 clique no WhatsApp para o canal e abre a conversa com
     "Ref.: SITE-<canal>". A contagem é feita por este script (e não pelo servidor)
     porque YouTube, Pinterest e outros sites "testam" o link sozinhos quando ele
     é colado no perfil; esses testes não rodam o script e por isso não viram cliente.

     18/11/2026 (blindagem contra teste/IA): só conta quando a pessoa CHEGOU
     clicando num link de fora (YouTube, Pinterest, Desapega...) ou quando
     aperta o botão "Falar no WhatsApp" de verdade. Abertura direta por robô,
     sem vinda de link e sem aperto do botão, não conta nada. -->
<main>
  <p>Abrindo o WhatsApp da Noiva Joias MT…</p>
  <a id="ir" href="https://wa.me/556592942810">Falar no WhatsApp</a>
</main>
<script src="/nj-produtos.js"></script>
<script>
(function(){
  var NOMES={youtube:'YouTube',pinterest:'Pinterest',desapega:'Desapega',tiktok:'TikTok',instagram:'Instagram',facebook:'Facebook',kwai:'Kwai',gmn:'Google'};
  var canal='direto';
  try{ canal=(new URLSearchParams(location.search).get('nj')||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,20)||'direto'; }catch(e){}
  /* Mensagem moldada (17/11/2026, pedido do dono): diz de onde a pessoa veio e, se o link
     trouxer &p=banhada | moeda | ambas, qual aliança ela viu. O atendente lê isso na conversa. */
  var prod='';
  try{ prod=(new URLSearchParams(location.search).get('p')||'').toLowerCase().replace(/[^a-z]/g,''); }catch(e){}
  var PROD=window.NJ_PROD||{}; /* lista única em /nj-produtos.js */
  var VI={youtube:'Vi seu vídeo no YouTube',pinterest:'Vi seu pin no Pinterest',desapega:'Vi meu anúncio no Desapega',tiktok:'Vi seu vídeo no TikTok',kwai:'Vi seu vídeo no Kwai',instagram:'Vi sua publicação no Instagram',facebook:'Vi sua publicação no Facebook',gmn:'Achei vocês no Google'};
  var texto;
  if(VI[canal] && PROD[prod]) texto='Oi, Sr. Fernandes! '+VI[canal]+' sobre '+PROD[prod].sobre+'. Quero conhecer melhor, pode me mandar as fotos e os valores?';
  else if(NOMES[canal]) texto='Oi, Sr. Fernandes! Vim pelo '+NOMES[canal]+' e quero conhecer as alianças. Pode me mandar as fotos e os valores?';
  else texto='Olá! Quero ver as fotos e os valores das alianças.';
  texto+='\n\nRef.: SITE-'+canal;
  try{ if(PROD[prod]) localStorage.setItem('nj_prod', JSON.stringify({p:prod, em:Date.now()})); }catch(e){}
  var destino='https://wa.me/556592942810?text='+encodeURIComponent(texto);
  document.getElementById('ir').href=destino;
  var interno=false, robo=false;
  try{ interno=/(?:^|;\s*)nj_interno=1/.test(document.cookie); }catch(e){}
  try{ interno=interno || localStorage.getItem('nj_interno')==='1'; }catch(e){}
  try{ robo=!!navigator.webdriver; }catch(e){}
  try{ if(window.__playwright||window.__pw||window.__puppeteer_evaluation__||window.cdc_adoQpoasnfa76pfcZLmcfl_) robo=true; }catch(e){}
  try{ if(/HeadlessChrome|Electron|Playwright|Puppeteer|Selenium|PhantomJS/i.test(navigator.userAgent||'')) robo=true; }catch(e){}
  try{ if(canal!=='direto') localStorage.setItem('nj_canal', JSON.stringify({c:canal, em:Date.now()})); }catch(e){}
  function vid(){ try{ var v=localStorage.getItem('nj_vid'); if(!v){ v=Math.random().toString(36).slice(2,12)+Date.now().toString(36); localStorage.setItem('nj_vid',v);} return v; }catch(e){ return ''; } }
  function manda(t){ return fetch('/api/t',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:t,c:canal,p:'/zap',v:vid()}),keepalive:true}).catch(function(){}); }
  /* Veio clicando num link de fora? (YouTube, Pinterest, Desapega, WhatsApp...) */
  function veioDeFora(){
    try{
      var r=document.referrer; if(!r) return false;
      var u=new URL(r); var h=(u.hostname||'').toLowerCase(); if(!h) return false;
      if(h==='localhost'||h==='127.0.0.1'||h==='::1'||h==='[::1]') return false;
      if(h==='noivajoiasmt.vercel.app'||h==='www.noivajoiasmt.vercel.app') return false;
      return true;
    }catch(e){ return false; }
  }
  var foi=false; function ir(){ if(foi) return; foi=true; location.replace(destino); }
  if(interno||robo){ ir(); return; }
  var contou=false;
  function conta(){ if(contou) return; contou=true; Promise.all([manda('visita'),manda('whats')]); }
  if(veioDeFora()){
    /* link clicado de fora: conta e abre o WhatsApp */
    setTimeout(function(){ conta(); ir(); },1200);
  }else{
    /* sem vinda de link: só conta se a pessoa apertar o botão de verdade */
    document.getElementById('ir').addEventListener('click',function(e){
      if(!e.isTrusted) return;
      conta();
    },true);
    setTimeout(ir,6000);
  }
})();
</script>
</body>
</html>
